<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auralis · 短剧工作台</title>
    <link rel="stylesheet" href="/style.css" />
  <script>const AURALIS_VERSION = '1.2.9'; const AURALIS_CHANGELOG = Object.freeze(["新增「接力拷打」：可另选模型，以全新视角审查当前环节，先整理项目中的用户偏好，再结合额外要求给出修改建议。","新增逐条对照编辑器：查看原文与修改版，编辑后采纳或忽略，采纳直接写回正文；视频参考支持新增、替换和删除。","无法直接修改的建议单独汇总，可一键复制给对应 Agent 继续处理。","设置中的提示词新增接力拷打的「用户偏好整理」和「正文审查」，均可切换 official 或保存 custom 自定义版本。"]);</script></head>
  <body>
    <aside id="rail">
      <a class="brand" href="/" aria-label="工作台首页"
        ><span class="brand-mark">A</span
        ><span>AURALIS<small>短剧工作台 <span id="appVersion" title="当前运行版本" hidden></span></small></span></a
      >
      <div id="navigation"></div>
      <div class="rail-bottom">
        <div id="serviceStatus" data-state="connecting" role="status" aria-live="polite">
          <span class="service-dot" aria-hidden="true"></span><span id="serviceLabel">正在连接后台</span>
        </div>
        <button data-action="settings" aria-label="生成设置">设置</button>
      </div>
    </aside>
    <main>
      <div id="serviceNotice" class="service-notice" role="alert" hidden>
        <span id="serviceNoticeText"></span>
        <button id="serviceRetry" type="button">重新连接</button>
      </div>
      <div id="updateReminder" class="update-reminder" role="status" aria-live="polite" hidden>
        <span>短剧工作台有新版本，请前往启动器更新</span>
        <button id="updateReminderDismiss" type="button" title="关闭新版提醒" aria-label="关闭新版提醒">×</button>
      </div>
      <div id="backupNotice" class="backup-notice" role="status" hidden>
        <span></span><button type="button" data-preference="backup">查看备份并重试</button>
      </div>
      <header id="header"></header>
      <nav id="stages" aria-label="制作阶段"></nav>
      <section id="workspace"></section>
    </main>
    <aside id="assistant">
      <div
        id="agentResize"
        role="separator"
        aria-label="调整创作搭档宽度"
        aria-orientation="vertical"
        aria-controls="assistant"
        tabindex="0"
        title="拖动调整宽度；双击恢复默认"
      ></div>
      <div class="assistant-heading">
        <span class="eyebrow">创作搭档</span
        ><span id="agentCompactStatus"></span
        ><button id="agentReset" type="button" title="结束当前阶段的执行会话；保留作品与聊天，下次发送从当前资料重新开始">重置 Agent</button
        ><button id="agentToggle" aria-label="展开或收起创作搭档">−</button>
      </div>
      <h3 id="agentRole">设定 Agent</h3>
      <p id="agentScope" class="muted"></p>
      <div class="agent-model-actions">
        <button id="agentController" class="quiet agent-controller" data-preference="controller" type="button">主控：本地 Codex</button>
        <button id="agentRelayReview" class="quiet" type="button">接力拷打</button>
      </div>
      <div
        id="agentStatus"
        class="agent-status"
        role="status"
        aria-live="polite"
      ></div>
      <details id="agentInputs" class="agent-inputs" hidden>
        <summary>本轮传入 Agent</summary>
        <div id="agentInputManifest"></div>
      </details>
      <details>
        <summary>额外带入的设定</summary>
        <p class="muted">通用设定与本集素材已自动提供。这里可补充其他条目。</p>
        <div id="settingSelection"></div>
      </details>
      <div id="agentMessages" role="log" aria-live="polite">
        <p class="muted">
          从一个设定开始。世界、人物和走向确定后，再开始你想做的那一集。
        </p>
      </div>
      <form id="agentForm">
        <div id="agentAttachments" class="attachment-strip"></div>
        <div id="agentAnnotations" aria-label="待发送批注"></div>
        <label class="sr-only" for="agentInput">告诉创作搭档你的要求</label
        ><textarea
          id="agentInput"
          placeholder="告诉它你想怎么改…"
          rows="4"
        ></textarea>
        <p id="agentDraftStatus" class="editor-note" role="status" hidden>已恢复未发送的消息。</p>
        <div class="agent-actions">
          <button type="button" data-action="addReference" class="quiet">
            添加图片
          </button>
          <button type="button" id="agentStop" class="quiet" disabled>
            停止</button
          ><button class="primary" type="submit" title="发送（Ctrl+Enter / ⌘+Enter）" aria-keyshortcuts="Control+Enter Meta+Enter">发送 ↗</button>
        </div>
      </form>
    </aside>
    <dialog id="dialog"><div id="dialogBody"></div></dialog>
    <div id="toast" role="status" popover="manual"></div>
    <div id="contextMenu" hidden></div>
    <div id="textAnnotationPopover" popover="auto"></div>
    <input
      id="referenceFiles"
      class="sr-only"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      multiple
      aria-label="上传参考图片"
    />
    <script src="/update-reminder.js"></script>
    <script src="/media-references.js"></script>
    <script src="/src/company-aigc.js"></script>
    <script src="/app.js"></script>
    <script src="/text-annotations.js"></script>
    <script src="/relay-review.js"></script>
    <script src="/service-health.js"></script>
    <script src="/preferences.js"></script>
    <script src="/canvas-bridge.js"></script>
    <script src="/clip-canvas.js"></script>
    <script src="/production-updates.js"></script>
    <script src="/asset-board.js"></script>
    <script src="/video-board.js"></script>
    <script src="/voice-board.js"></script>
    <script src="/production-status.js"></script>
    <script src="/media-review.js"></script>
  </body>
</html>
